version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hireiq-backend
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:6901,http://localhost:5173
      - RATE_LIMIT_PER_MINUTE=60
    volumes:
      - ./backend/db:/app/db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hireiq-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
