name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Pytest
      env:
        JWT_SECRET_KEY: "dummy_jwt_secret_key_for_testing_123456789" # pragma: allowlist secret
        FIELD_ENCRYPTION_KEY: "L9V8Sba4Nr33J_NcEL1w9PYSiaYvTGTicgDzPPtjdn4=" # pragma: allowlist secret
        SUPABASE_URL: "https://ndkjiycehjdkcqupphuu.supabase.co"
        SUPABASE_KEY: "dummy_supabase_key"
        ALLOWED_ORIGINS: "http://localhost:5173"
      run: |
        pytest backend/tests/ -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Build frontend
      working-directory: frontend
      run: npm run build

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Trigger Staging Deploy Webhook
      run: |
        # Call hosting provider's deploy hook via GitHub secret
        # PLACEHOLDER: Ensure you have added the RENDER_STAGING_DEPLOY_HOOK secret in GitHub Repository Secrets.
        curl -Ssf "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}" || echo "No staging hook configured, skipping"

    - name: Checkout code (for staging smoke test script)
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install HTTPX dependency for smoke test
      run: |
        python -m pip install --upgrade pip
        pip install httpx

    - name: Wait briefly and run Staging Smoke Test Verification
      run: |
        # Wait 15 seconds for build initiation
        sleep 15
        # Run verify_staging.py against staging API URL
        # PLACEHOLDER: Ensure you have added the STAGING_API_URL secret in GitHub Repository Secrets (e.g., https://staging-api.hireiq.com)
        python backend/scripts/verify_staging.py --url "${{ secrets.STAGING_API_URL }}"
