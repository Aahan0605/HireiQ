name: CI Pipeline

on:
  push:
    branches: [ main, test-ci-fail ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Pytest
      env:
        JWT_SECRET_KEY: "dummy_jwt_secret_key_for_testing_123456789" # pragma: allowlist secret
        FIELD_ENCRYPTION_KEY: "L9V8Sba4Nr33J_NcEL1w9PYSiaYvTGTicgDzPPtjdn4=" # pragma: allowlist secret
        SUPABASE_URL: "https://ndkjiycehjdkcqupphuu.supabase.co"
        SUPABASE_KEY: "dummy_supabase_key"
        ALLOWED_ORIGINS: "http://localhost:5173"
      run: |
        cd backend
        python -m pytest tests/ -v > ../pytest_run.log 2>&1
        PYTEST_EXIT=$?
        cd ..
        if [ $PYTEST_EXIT -ne 0 ]; then
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add pytest_run.log
          git commit -m "chore: save CI pytest log [skip ci]" || true
          git push origin HEAD:main || true
        fi
        exit $PYTEST_EXIT

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Build frontend
      working-directory: frontend
      run: npm run build

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Trigger Staging Deploy Webhook
      run: |
        if [ -z "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}" ]; then
          echo "No staging hook configured, skipping"
        else
          curl -Ssf "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"
        fi

    - name: Checkout code (for staging smoke test script)
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install HTTPX dependency for smoke test
      run: |
        python -m pip install --upgrade pip
        pip install httpx

    - name: Wait briefly and run Staging Smoke Test Verification
      run: |
        if [ -z "${{ secrets.STAGING_API_URL }}" ]; then
          echo "STAGING_API_URL secret is not configured. Skipping smoke test."
          exit 0
        fi
        # Wait 15 seconds for build initiation
        sleep 15
        python backend/scripts/verify_staging.py --url "${{ secrets.STAGING_API_URL }}"
