name: HireIQ CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest unit tests
        env:
          SUPABASE_URL: https://mock-project.supabase.co
          SUPABASE_SERVICE_KEY: mock-service-role-key-here # pragma: allowlist secret
          GEMINI_API_KEY: mock-gemini-key # pragma: allowlist secret
          JWT_SECRET_KEY: mock-jwt-secret-key-here-that-is-long # pragma: allowlist secret
          FIELD_ENCRYPTION_KEY: "L9V8Sba4Nr33J_NcEL1w9PYSiaYvTGTicgDzPPtjdn4=" # pragma: allowlist secret # pragma: allowlist secret
        run: |
          cd backend
          pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Trigger Staging Deploy Webhook
      run: |
        if [ -z "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}" ]; then
          echo "No staging hook configured, skipping"
        else
          curl -Ssf "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"
        fi

    - name: Checkout code (for staging smoke test script)
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install HTTPX dependency for smoke test
      run: |
        python -m pip install --upgrade pip
        pip install httpx

    - name: Wait briefly and run Staging Smoke Test Verification
      run: |
        if [ -z "${{ secrets.STAGING_API_URL }}" ]; then
          echo "STAGING_API_URL secret is not configured. Skipping smoke test."
          exit 0
        fi
        # Wait 15 seconds for build initiation
        sleep 15
        python backend/scripts/verify_staging.py --url "${{ secrets.STAGING_API_URL }}"


