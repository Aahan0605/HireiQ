name: HireIQ CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest unit tests
        env:
          SUPABASE_URL: https://mock-project.supabase.co
          SUPABASE_SERVICE_KEY: mock-service-role-key-here # pragma: allowlist secret
          GEMINI_API_KEY: mock-gemini-key # pragma: allowlist secret
          JWT_SECRET_KEY: mock-jwt-secret-key-here-that-is-long # pragma: allowlist secret
          FIELD_ENCRYPTION_KEY: "L9V8Sba4Nr33J_NcEL1w9PYSiaYvTGTicgDzPPtjdn4=" # pragma: allowlist secret
        run: |
          cd backend
          pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
